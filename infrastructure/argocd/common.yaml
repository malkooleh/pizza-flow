apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: common-library
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/malkooleh/pizza-flow.git
    targetRevision: HEAD
    path: infrastructure/helm/common
  destination:
    server: https://kubernetes.default.svc
    namespace: pizzaflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
